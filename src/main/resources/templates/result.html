<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="utf-8">
  <title>Kết quả UI Diff</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>pre{white-space:pre-wrap}</style>
</head>
<body class="bg-gray-100 min-h-screen">
<header class="bg-white border-b">
  <div class="max-w-6xl mx-auto px-6 py-4">
    <h1 class="text-2xl font-bold">Kết quả phát hiện thay đổi UI</h1>
  </div>
</header>
<main class="max-w-6xl mx-auto px-6 py-8 space-y-10">
  <div th:each="r : ${results}">
    <section class="bg-white rounded-xl shadow p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4">Session: <span th:text="${r.id}"></span></h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <h3 class="font-semibold mb-2">V1 (baseline)</h3>
          <img th:src="@{${r.v1Shot}}" class="border rounded">
        </div>
        <div>
          <h3 class="font-semibold mb-2">V2 (candidate)</h3>
          <img th:src="@{${r.v2Shot}}" class="border rounded">
        </div>
        <div>
          <h3 class="font-semibold mb-2">Diff (khung đỏ)</h3>
          <img th:src="@{${r.imgDiff}}" class="border rounded">
        </div>
      </div>
    </section>
    <section class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-semibold mb-2">DOM khác biệt</h2>
      <div th:if="${r.domDiff != null}">
        <pre th:text="${r.domDiff}"></pre>
      </div>
      <div th:if="${r.domDiff == null}">
        <pre>Không có DOM diff.</pre>
      </div>
    </section>
  </div>
  <div><a href="/" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">So sánh lại</a></div>
</main>
</body>
</html>
